<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Gradients -->
    <defs>
        <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ff3366"/>
            <stop offset="100%" style="stop-color:#8a2be2"/>
        </linearGradient>
        
        <!-- Glow filter -->
        <filter id="glow">
            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background hexagon -->
    <path d="M100 20
             L160 50
             L160 150
             L100 180
             L40 150
             L40 50 Z" 
          fill="rgba(255,255,255,0.03)" 
          stroke="url(#mainGradient)" 
          stroke-width="2"/>

    <!-- Inner hexagon with gradient -->
    <path d="M100 40
             L140 60
             L140 140
             L100 160
             L60 140
             L60 60 Z" 
          fill="url(#mainGradient)" 
          filter="url(#glow)"/>

    <!-- S letter -->
    <path d="M85 70
             C85 70, 115 70, 115 85
             C115 100, 85 100, 85 115
             C85 130, 115 130, 115 130" 
          fill="none"
          stroke="#fff"
          stroke-width="8"
          stroke-linecap="round"
          filter="url(#glow)"/>

    <!-- Decorative circles -->
    <circle cx="100" cy="40" r="3" fill="#fff"/>
    <circle cx="140" cy="60" r="3" fill="#fff"/>
    <circle cx="140" cy="140" r="3" fill="#fff"/>
    <circle cx="100" cy="160" r="3" fill="#fff"/>
    <circle cx="60" cy="140" r="3" fill="#fff"/>
    <circle cx="60" cy="60" r="3" fill="#fff"/>

    <!-- Circuit lines -->
    <path d="M100 37 L100 20" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <path d="M143 60 L160 50" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <path d="M143 140 L160 150" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <path d="M100 163 L100 180" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <path d="M57 140 L40 150" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <path d="M57 60 L40 50" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
</svg>
