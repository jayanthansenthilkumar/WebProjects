<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WiFi Loader Design</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* WiFi Loader Animation */
    .wifi-loader {
      position: relative;
      width: 80px;
      height: 80px;
    }

    .wifi-loader span {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 4px solid transparent;
      border-top-color: #4f46e5; /* Tailwind indigo-600 */
      border-radius: 50%;
      animation: pulse-wave 1.5s infinite ease-in-out;
      opacity: 0;
    }

    .wifi-loader span:nth-child(1) {
      top: 12px;
      left: 12px;
      width: 56px;
      height: 56px;
      animation-delay: 0s;
    }

    .wifi-loader span:nth-child(2) {
      top: 4px;
      left: 4px;
      width: 72px;
      height: 72px;
      animation-delay: 0.3s;
    }

    .wifi-loader span:nth-child(3) {
      top: 0;
      left: 0;
      width: 80px;
      height: 80px;
      animation-delay: 0.6s;
    }

    @keyframes pulse-wave {
      0% {
        transform: scale(0.8);
        opacity: 0.8;
      }
      50% {
        transform: scale(1);
        opacity: 0.4;
      }
      100% {
        transform: scale(1.2);
        opacity: 0;
      }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center">

  <!-- Unique WiFi Symbol Loader -->
  <div id="loader" class="fixed inset-0 flex items-center justify-center bg-white z-50">
    <div class="wifi-loader">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <!-- Content -->
  <div id="content" class="hidden">
    <header class="w-full bg-indigo-500 text-white py-4 shadow">
      <div class="container mx-auto text-center">
        <h1 class="text-3xl font-bold">Welcome to My Website</h1>
      </div>
    </header>

    <main class="container mx-auto my-10">
      <div class="text-center">
        <h2 class="text-2xl font-semibold text-gray-800">WiFi Symbol Loader</h2>
        <p class="mt-4 text-gray-600">
          This loader is designed to resemble a pulsing WiFi signal using Tailwind CSS and custom animations.
        </p>
      </div>
    </main>

    <footer class="w-full bg-gray-800 text-white py-4 mt-auto">
      <div class="container mx-auto text-center">
        <p>&copy; 2025 Your Website. All rights reserved.</p>
      </div>
    </footer>
  </div>

  <script>
    // Simulate content loading
    window.addEventListener("load", () => {
      const loader = document.getElementById("loader");
      const content = document.getElementById("content");

      setTimeout(() => {
        loader.classList.add("hidden");
        content.classList.remove("hidden");
      }, 2000); // Adjust delay as needed
    });
  </script>
</body>
</html>
